<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>돌 조각하기 - 3D 작업실</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid #e8eaed;
  }
  header .home {
    text-decoration: none;
    font-size: 20px;
    font-weight: 500;
    color: #202124;
  }
  header .home span { color: #4285f4; }
  header .right { font-size: 14px; color: #5f6368; }

  .workspace {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    padding: 24px;
    flex-wrap: wrap;
  }

  .tools {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #f8f9fa;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 16px;
    min-width: 175px;
  }
  .tools h3 { font-size: 13px; color: #5f6368; font-weight: 500; margin-bottom: 4px; }
  .tool-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: all .1s;
  }
  .tool-btn:hover { background: #f1f3f4; }
  .tool-btn.active {
    background: #e8f0fe;
    border-color: #1a73e8;
    color: #1a73e8;
    font-weight: 500;
  }
  .tool-btn .icon { font-size: 18px; }
  .divider { height: 1px; background: #e8eaed; margin: 6px 0; }
  .action-btn {
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    color: #d93025;
  }
  .action-btn:hover { background: #fce8e6; }
  .action-btn.save { color: #188038; }
  .action-btn.save:hover { background: #e6f4ea; }
  .action-btn.photo { color: #1a73e8; }
  .action-btn.photo:hover { background: #e8f0fe; }
  .action-btn.gallery { color: #5f6368; }
  .action-btn.gallery:hover { background: #f1f3f4; }
  .size-label { font-size: 12px; color: #5f6368; margin-top: 4px; }
  input[type=range] { width: 100%; }

  .canvas-wrap {
    position: relative;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    overflow: hidden;
    width: min(760px, 92vw);
    height: min(560px, 70vh);
  }
  .canvas-wrap canvas { display: block; touch-action: none; cursor: crosshair; }
  .canvas-wrap.rotating canvas { cursor: grab; }
  .loading {
    position: absolute; inset: 0;
    display: flex; justify-content: center; align-items: center;
    font-size: 14px; color: #5f6368; background: #fafafa;
  }
  .hint {
    text-align: center;
    font-size: 13px;
    color: #80868b;
    padding-bottom: 16px;
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: #202124;
    color: #fff;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
    z-index: 20;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <a class="home" href="index.html">🪨 <span>돌</span> 조각하기</a>
    <div class="right" id="userLabel"></div>
  </header>

  <div class="workspace">
    <div class="tools">
      <h3>조각 도구</h3>
      <button class="tool-btn active" data-tool="chisel-small"><span class="icon">🔪</span>작은 정</button>
      <button class="tool-btn" data-tool="chisel-large"><span class="icon">⛏️</span>큰 정</button>
      <button class="tool-btn" data-tool="hammer"><span class="icon">🔨</span>망치</button>
      <button class="tool-btn" data-tool="polish"><span class="icon">🧽</span>다듬기</button>
      <button class="tool-btn" data-tool="rotate"><span class="icon">🔄</span>회전 보기</button>
      <div class="size-label">도구 크기</div>
      <input type="range" id="sizeRange" min="5" max="40" value="14" />
      <div class="divider"></div>
      <button class="action-btn save" id="saveBtn">💾 보관함에 저장</button>
      <button class="action-btn photo" id="photoBtn">📷 사진으로 저장</button>
      <button class="action-btn gallery" id="galleryBtn">🗂 내 돌 보관함</button>
      <button class="action-btn" id="resetBtn">↺ 새 돌 가져오기</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <div class="loading" id="loading">3D 돌을 준비하는 중…</div>
    </div>
  </div>

  <div class="hint">빈 공간을 드래그하면 360° 회전, 휠로 확대/축소 · 돌 표면을 클릭하거나 드래그하면 조각됩니다</div>
  <div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { saveStone, getStone } from './db.js';

const user = localStorage.getItem('currentUser');
document.getElementById('userLabel').textContent = user ? user + '님의 작업실' : '게스트 작업실';

const wrap = document.getElementById('canvasWrap');
const WIDTH = () => wrap.clientWidth;
const HEIGHT = () => wrap.clientHeight;

/* ---------- 씬 구성 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8f9fa);

const camera = new THREE.PerspectiveCamera(45, WIDTH() / HEIGHT(), 0.1, 100);
camera.position.set(0, 0.6, 4.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(WIDTH(), HEIGHT());
wrap.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x888899, 1.1));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.4);
fillLight.position.set(-4, -2, -3);
scene.add(fillLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 10;

/* ---------- 마칭 큐브 돌 ---------- */
const RES = 64;
const HALF = RES / 2;
const stoneMat = new THREE.MeshStandardMaterial({
  color: 0x9a9a96,
  roughness: 0.92,
  metalness: 0.02,
  flatShading: false
});
const effect = new MarchingCubes(RES, stoneMat, false, false, 300000);
effect.isolation = 0.6;
effect.scale.set(1.5, 1.5, 1.5);
scene.add(effect);

/* 3D 밸류 노이즈 (랜덤 시드) */
let perm = [];
function seedNoise() {
  perm = Array.from({ length: 256 }, () => Math.random());
}
function hash(x, y, z) {
  const n = (x * 73 + y * 179 + z * 283) & 255;
  return perm[n];
}
function smooth(t) { return t * t * (3 - 2 * t); }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = smooth(xf), v = smooth(yf), w = smooth(zf);
  const lerp = (a, b, t) => a + (b - a) * t;
  return lerp(
    lerp(
      lerp(hash(xi, yi, zi),     hash(xi + 1, yi, zi), u),
      lerp(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), u), v),
    lerp(
      lerp(hash(xi, yi, zi + 1),     hash(xi + 1, yi, zi + 1), u),
      lerp(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), u), v),
    w) * 2 - 1;
}
function fbm(x, y, z) {
  return noise3(x, y, z) * 0.6 + noise3(x * 2.3, y * 2.3, z * 2.3) * 0.3 + noise3(x * 5.1, y * 5.1, z * 5.1) * 0.1;
}

/* 랜덤 돌 생성: 노이즈로 울퉁불퉁한 타원체 */
function generateStone() {
  seedNoise();
  const rx = 0.55 + Math.random() * 0.2;
  const ry = 0.45 + Math.random() * 0.25;
  const rz = 0.5 + Math.random() * 0.22;
  const ox = Math.random() * 10, oy = Math.random() * 10, oz = Math.random() * 10;
  const field = effect.field;
  for (let z = 0; z < RES; z++) {
    const pz = (z - HALF) / HALF;
    for (let y = 0; y < RES; y++) {
      const py = (y - HALF) / HALF;
      for (let x = 0; x < RES; x++) {
        const px = (x - HALF) / HALF;
        const d = Math.sqrt((px / rx) ** 2 + (py / ry) ** 2 + (pz / rz) ** 2);
        const n = fbm(px * 2.2 + ox, py * 2.2 + oy, pz * 2.2 + oz);
        field[z * RES * RES + y * RES + x] = (1 - d) * 3 + n * 1.1;
      }
    }
  }
  refreshMesh();
}

function refreshMesh() {
  effect.update();
  effect.geometry.computeBoundingBox();
  effect.geometry.computeBoundingSphere();
}

/* ---------- 조각 ---------- */
let tool = 'chisel-small';
let toolSize = 14;
let carving = false;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pickStone(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(effect);
  return hits.length ? hits[0] : null;
}

function worldToGrid(worldPoint) {
  const local = effect.worldToLocal(worldPoint.clone()); // 로컬 -1..1
  return [
    (local.x + 1) * HALF,
    (local.y + 1) * HALF,
    (local.z + 1) * HALF
  ];
}

function toolRadius() {
  const mult = tool === 'hammer' ? 1.9 : tool === 'chisel-large' ? 1.4 : 1;
  return (toolSize / 130) * HALF * mult; // 그리드 단위 반경
}

/* 구형 영역을 필드에서 빼서 깎기 */
function carveAt(gx, gy, gz) {
  const field = effect.field;
  const r = toolRadius();
  const r2 = r * r;
  const strength = tool === 'hammer' ? 5 : 3.2;
  const jag = tool === 'polish' ? 0 : 0.6; // 들쭉날쭉함
  const x0 = Math.max(1, Math.floor(gx - r)), x1 = Math.min(RES - 2, Math.ceil(gx + r));
  const y0 = Math.max(1, Math.floor(gy - r)), y1 = Math.min(RES - 2, Math.ceil(gy + r));
  const z0 = Math.max(1, Math.floor(gz - r)), z1 = Math.min(RES - 2, Math.ceil(gz + r));

  if (tool === 'polish') {
    // 다듬기: 주변 평균값과 섞어 표면을 부드럽게
    const copy = new Float32Array(field);
    for (let z = z0; z <= z1; z++) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x - gx, dy = y - gy, dz = z - gz;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > r2) continue;
      const q = z * RES * RES + y * RES + x;
      const avg = (
        copy[q - 1] + copy[q + 1] +
        copy[q - RES] + copy[q + RES] +
        copy[q - RES * RES] + copy[q + RES * RES]
      ) / 6;
      const f = 1 - d2 / r2;
      field[q] += (avg - field[q]) * 0.6 * f;
    }
  } else {
    for (let z = z0; z <= z1; z++) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x - gx, dy = y - gy, dz = z - gz;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > r2) continue;
      const q = z * RES * RES + y * RES + x;
      const falloff = 1 - d2 / r2;
      const rough = 1 + (Math.random() - 0.5) * jag;
      field[q] -= strength * falloff * rough;
    }
  }
  refreshMesh();
}

function strike(e) {
  const hit = pickStone(e);
  if (!hit) return false;
  const [gx, gy, gz] = worldToGrid(hit.point);
  if (tool === 'hammer') {
    // 망치: 타격 지점 주변 여러 조각이 떨어져 나감
    carveAt(gx, gy, gz);
    for (let i = 0; i < 3; i++) {
      const r = toolRadius();
      carveAt(gx + (Math.random() - 0.5) * r, gy + (Math.random() - 0.5) * r, gz + (Math.random() - 0.5) * r);
    }
    spawnParticles(hit.point, hit.face.normal, 26);
  } else {
    carveAt(gx, gy, gz);
    spawnParticles(hit.point, hit.face.normal, tool === 'polish' ? 4 : 10);
  }
  return true;
}

/* ---------- 돌가루 파티클 ---------- */
const MAXP = 400;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAXP * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0xb0b0ac, size: 0.035, transparent: true, opacity: 0.9 });
const pointsObj = new THREE.Points(pGeo, pMat);
pointsObj.frustumCulled = false;
scene.add(pointsObj);
let particles = [];

function spawnParticles(point, normal, count) {
  const n = normal.clone().transformDirection(effect.matrixWorld);
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAXP) break;
    particles.push({
      pos: point.clone(),
      vel: new THREE.Vector3(
        n.x * 0.02 + (Math.random() - 0.5) * 0.04,
        n.y * 0.02 + Math.random() * 0.035,
        n.z * 0.02 + (Math.random() - 0.5) * 0.04
      ),
      life: 1
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.vel.y -= 0.0022; // 중력
    p.pos.add(p.vel);
    p.life -= 0.016;
  }
  for (let i = 0; i < MAXP; i++) {
    if (i < particles.length) {
      pPos[i * 3] = particles[i].pos.x;
      pPos[i * 3 + 1] = particles[i].pos.y;
      pPos[i * 3 + 2] = particles[i].pos.z;
    } else {
      pPos[i * 3 + 1] = -9999;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
}

/* ---------- 입력: 돌을 찍으면 조각, 빈 곳 드래그는 회전 ---------- */
renderer.domElement.addEventListener('pointerdown', e => {
  if (tool === 'rotate') return; // 회전 모드는 OrbitControls에 맡김
  const hit = pickStone(e);
  if (hit) {
    controls.enabled = false; // 이번 드래그는 조각
    carving = true;
    strike(e);
  }
}, { capture: true });

renderer.domElement.addEventListener('pointermove', e => {
  if (!carving) return;
  if (tool === 'hammer') return; // 망치는 클릭 타격만
  strike(e);
});

function endStroke() {
  carving = false;
  controls.enabled = true;
}
renderer.domElement.addEventListener('pointerup', endStroke);
renderer.domElement.addEventListener('pointercancel', endStroke);
renderer.domElement.addEventListener('pointerleave', endStroke);

/* ---------- 도구 / 버튼 ---------- */
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
    wrap.classList.toggle('rotating', tool === 'rotate');
  });
});
document.getElementById('sizeRange').addEventListener('input', e => {
  toolSize = Number(e.target.value);
});
/* ---------- 보관함 저장 / 불러오기 ---------- */
let loadedId = null;        // 보관함에서 불러온 작품 id (덮어쓰기용)
let loadedName = null;
let loadedCreatedAt = null;

function flash(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(flash._timer);
  flash._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function makeThumb() {
  renderer.render(scene, camera);
  const src = renderer.domElement;
  const c = document.createElement('canvas');
  c.width = 240; c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#f8f9fa';
  g.fillRect(0, 0, c.width, c.height);
  const scale = Math.max(c.width / src.width, c.height / src.height);
  const w = src.width * scale, h = src.height * scale;
  g.drawImage(src, (c.width - w) / 2, (c.height - h) / 2, w, h);
  return c.toDataURL('image/jpeg', 0.82);
}

async function saveToGallery() {
  let overwrite = false;
  if (loadedId !== null) {
    overwrite = confirm('기존 작품에 덮어쓸까요?\n[취소]를 누르면 새 작품으로 저장됩니다.');
  }
  let name = prompt('작품 이름을 입력하세요', loadedName || '나의 돌조각');
  if (name === null) return;
  name = name.trim() || '나의 돌조각';

  const record = {
    name,
    owner: user || '게스트',
    res: RES,
    field: effect.field.slice().buffer,
    thumb: makeThumb(),
    updatedAt: Date.now(),
    createdAt: overwrite ? loadedCreatedAt : Date.now()
  };
  if (overwrite) record.id = loadedId;

  try {
    const id = await saveStone(record);
    loadedId = id;
    loadedName = name;
    loadedCreatedAt = record.createdAt;
    flash('🪨 「' + name + '」 보관함에 저장되었습니다');
  } catch (err) {
    console.error(err);
    flash('저장에 실패했습니다: ' + err.message);
  }
}

document.getElementById('saveBtn').addEventListener('click', saveToGallery);
document.getElementById('photoBtn').addEventListener('click', () => {
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = (loadedName || '나의_돌조각') + '.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
});
document.getElementById('galleryBtn').addEventListener('click', () => {
  location.href = 'gallery.html';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('새 돌을 가져올까요? 지금 작업은 사라집니다.')) {
    loadedId = null;
    loadedName = null;
    loadedCreatedAt = null;
    generateStone();
  }
});

/* ---------- 리사이즈 / 렌더 루프 ---------- */
window.addEventListener('resize', () => {
  camera.aspect = WIDTH() / HEIGHT();
  camera.updateProjectionMatrix();
  renderer.setSize(WIDTH(), HEIGHT());
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateParticles();
  renderer.render(scene, camera);
}

/* 보관함에서 불러오기 (?load=id) 또는 새 랜덤 돌 */
async function init() {
  const loadParam = new URLSearchParams(location.search).get('load');
  let loaded = false;
  if (loadParam) {
    try {
      const rec = await getStone(Number(loadParam));
      if (rec && rec.res === RES) {
        effect.field.set(new Float32Array(rec.field));
        loadedId = rec.id;
        loadedName = rec.name;
        loadedCreatedAt = rec.createdAt;
        refreshMesh();
        loaded = true;
        flash('🪨 「' + rec.name + '」 불러왔습니다');
      }
    } catch (err) {
      console.error(err);
    }
  }
  if (!loaded) generateStone();
  document.getElementById('loading').remove();
  animate();
}
init();
</script>
</body>
</html>
